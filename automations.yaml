- id: '1793817103871'
  alias: Chauffage salle de bain - allumage 7h
  description: À 7h, du lundi au vendredi, allume le chauffage de la salle de bain
    si Bruno est à la maison et qu'il fait moins de 18 °C. L'extinction est gérée
    par un autre script.
  triggers:
  - trigger: time
    at: 07:05:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: person.bruno
    state: home
  - condition: numeric_state
    entity_id: sensor.temperature_sdb_historique
    below: 18
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.tasmota_3
  mode: single
- id: '1793818370474'
  alias: Chauffage salle de bain - extinction après 25 min
  description: Éteint le chauffage de la salle de bain 10 minutes après son allumage,
    qu'il ait été allumé manuellement (bouton Tasmota) ou depuis Home Assistant. Au
    démarrage de Home Assistant, l'éteint directement s'il est allumé.
  triggers:
  - trigger: state
    entity_id: switch.tasmota_3
    to: 'on'
    for:
      minutes: 25
    id: dix_minutes
  - trigger: homeassistant
    event: start
    id: demarrage
  actions:
  - if:
    - condition: trigger
      id: demarrage
    then:
    - delay:
        seconds: 30
  - condition: state
    entity_id: switch.tasmota_3
    state: 'on'
  - action: switch.turn_off
    target:
      entity_id: switch.tasmota_3
  mode: single
- id: '1794000000001'
  alias: Capteur sans remontée
  description: Notifie quand un capteur n'envoie plus de valeur depuis plus de
    « Délai capteur muet » heures, ou devient injoignable, puis quand tout revient.
  triggers:
  - trigger: state
    entity_id: sensor.capteurs_muets
    attribute: capteurs
    for:
      minutes: 5
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state.state
      not in [''unavailable'', ''unknown''] }}'
  actions:
  - variables:
      avant: '{{ trigger.from_state.attributes.capteurs | default([], true) }}'
      apres: '{{ trigger.to_state.attributes.capteurs | default([], true) }}'
      nouveaux: '{{ apres | reject(''in'', avant) | list }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ nouveaux | count > 0 }}'
      sequence:
      - action: notify.mobile_app_sm_a528b
        data:
          title: Capteur sans remontée
          message: '{{ nouveaux | join('', '') }} (délai : {{ states(''input_number.delai_capteur_muet'')
            | int(3) }} h)'
          data:
            tag: capteurs_muets
    - conditions:
      - condition: template
        value_template: '{{ apres | count == 0 and avant | count > 0 }}'
      sequence:
      - action: notify.mobile_app_sm_a528b
        data:
          title: Capteurs rétablis
          message: Tous les capteurs envoient de nouveau leurs valeurs.
          data:
            tag: capteurs_muets
  mode: queued
- id: '1794000000002'
  alias: Veilleuse automatique salon
  description: Quand il fait nuit (soleil couché) et que le plafond est absent
    (interrupteur mural coupé, donc couché), allume la scène Veilleuse si une présence
    est détectée au salon ou devant la tablette et que tout est éteint. L'éteint après
    3 min sans présence, sauf si quelqu'un a changé l'éclairage entre-temps. Si le
    plafond est présent, on ne fait rien.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_temperature_salon_motion_detection
    - binary_sensor.living_room_tablette_esp_mouvement
    to: 'on'
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: light.wled_2
    state: unavailable
  - condition: template
    value_template: >-
      {{ ['light.living_room_cadre_wled', 'light.buffet_groupe', 'light.wled_3',
          'light.living_room_cube_wled_main', 'switch.tasmota']
         | select('is_state', 'on') | list | count == 0 }}
  actions:
  - action: scene.turn_on
    target:
      entity_id: scene.veilleuse
    data:
      transition: 2
  - wait_for_trigger:
    - trigger: template
      value_template: >-
        {{ is_state('binary_sensor.living_room_temperature_salon_motion_detection', 'off')
           and is_state('binary_sensor.living_room_tablette_esp_mouvement', 'off') }}
      for:
        minutes: 3
    timeout:
      hours: 1
    continue_on_timeout: true
  # On n'éteint que si l'éclairage est toujours celui de la veilleuse
  - condition: template
    value_template: >-
      {{ not is_state('light.living_room_cadre_wled', 'on')
         and not is_state('light.wled_2', 'on') and not is_state('light.wled_3', 'on')
         and not is_state('switch.tasmota', 'on')
         and (state_attr('light.living_room_cube_wled_main', 'brightness') | int(0)) <= 20
         and (state_attr('light.buffet_groupe', 'brightness') | int(0)) <= 20 }}
  - action: light.turn_off
    target:
      entity_id:
      - light.buffet_groupe
      - light.living_room_cube_wled_main
    data:
      transition: 5
  mode: single
  max_exceeded: silent
- id: '1794000000003'
  alias: Réveil en semaine
  description: Du lundi au vendredi à 7h, si Bruno est à la maison et qu'il fait encore
    sombre, allume progressivement la scène Réveil. Tout s'éteint quand le plafond
    disparaît (interrupteur mural coupé en partant), ou au bout de 4 h au plus tard.
  triggers:
  - trigger: time
    at: 07:00:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: person.bruno
    state: home
  - condition: sun
    before: sunrise
    before_offset: 00:30:00
  actions:
  - action: scene.turn_on
    target:
      entity_id: scene.reveil
    data:
      transition: 60
  # Attend que le plafond devienne absent (30 s pour ignorer un simple redémarrage WLED)
  - wait_for_trigger:
    - trigger: state
      entity_id: light.wled_2
      to: unavailable
      for:
        seconds: 30
    timeout:
      hours: 4
    continue_on_timeout: true
  - action: scene.turn_on
    target:
      entity_id: scene.tout_eteindre
    data:
      transition: 5
  mode: single
