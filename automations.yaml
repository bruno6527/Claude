- id: '1792230321893'
  alias: Presence
  description: ''
  triggers:
  - trigger: zone.entered
    target:
      entity_id: person.bruno
    options:
      behavior: each
      for: 00:00:00
      zone: zone.home
  - trigger: state
    entity_id: sensor.sm_a528b_wi_fi_connection
    to: Livebox-A3A7
  conditions:
  - condition: switch.is_on
    target:
      entity_id: input_boolean.mode_alarme_auto
    options:
      behavior: any
      for: 00:00:00
  actions:
  - action: input_boolean.turn_off
    metadata: {}
    target:
      entity_id: input_boolean.mode_alarme
    data: {}
  mode: single
- id: '1792233364145'
  alias: Absence
  description: ''
  triggers:
  - trigger: zone.left
    target:
      entity_id: person.bruno
    options:
      behavior: each
      for: 00:00:00
      zone: zone.home
  conditions:
  - condition: switch.is_on
    target:
      entity_id: input_boolean.mode_alarme_auto
    options:
      behavior: any
