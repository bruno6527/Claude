- id: '1792309230070'
  alias: Volume téléphone sono
  description: Règle le volume média du téléphone depuis le curseur
  triggers:
  - trigger: state
    entity_id: input_number.volume_tel_sono
  conditions:
  - condition: template
    value_template: "{% set max_vol = 15 %} {{ (states('input_number.volume_tel_sono')
      | float(0) * max_vol / 100) | round(0) | int\n   != states('sensor.tel_musique_volume_level_music')
      | int(-1) }}\n"
  actions:
  - action: notify.mobile_app_tel_musique
    data:
      message: command_volume_level
      data:
        media_stream: music_stream
        command: '{% set max_vol = 150 %} {{ (states(''input_number.volume_tel_sono'')
          | float(0) * max_vol / 100) | round(0) | int }}

          '
        ttl: 0
        priority: high
  mode: restart
- id: '1792310602978'
  alias: Synchro curseur volume téléphone
  description: Met à jour le curseur quand le volume change sur le téléphone
  triggers:
  - trigger: state
    entity_id: sensor.tel_musique_volume_level_music
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state is number or trigger.to_state.state
      | int(-1) >= 0 }}'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.volume_tel_sono
    data:
      value: '{% set max_vol = 150 %} {{ ((states(''sensor.tel_musique_volume_level_music'')
        | float(0) * 100 / max_vol / 5) | round(0) * 5) | int }}

        '
  mode: restart
- id: '1792312259290'
  alias: Batterie faible tel musique et tablette
  description: Notification sur le téléphone quand la batterie descend sous 15 %
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.tel_musique_battery_level
    - sensor.tablette_samsung_battery_level
    below: 20
    for:
      minutes: 1
  actions:
  - action: notify.mobile_app_sm_a528b
    data:
      title: Batterie faible
      message: '{{ trigger.to_state.attributes.friendly_name }} : {{ trigger.to_state.state
        }} %

        '
      data:
        tag: batterie_{{ trigger.entity_id }}
  - action: notify.mobile_app_tablette_samsung
    data:
      message: TTS
      data:
        tts_text: Batterie Faible
  mode: parallel
