# ---------- Variables ----------
globals:
  # Lumière dont on change la couleur (choisie sur la page Lumières)
  - id: color_target
    type: std::string
    restore_value: no
    initial_value: '""'

# ---------- Interface ----------
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch

  style_definitions:
    - id: style_card
      bg_color: 0x070E1B
      bg_opa: 95%
      border_color: 0x1E2D4A
      border_width: 1
      border_opa: 60%
      radius: 16
      shadow_width: 0
      pad_all: 0
      text_color: 0xF1F5F9
      text_font: r22
    - id: style_navbtn
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      radius: 16
      pad_all: 0
      text_color: 0x8E9FB8

  # Barre de navigation (icônes seules) + en-tête commun
  top_layer:
    widgets:
      - obj:
          id: nav_bar
          hidden: true
          x: 0
          y: 0
          width: 72
          height: 480
          pad_all: 0
          scrollbar_mode: "OFF"
          bg_color: 0x070E1B
          bg_opa: COVER
          border_width: 0
          radius: 0
          widgets:
            - button:
                id: nav_0
                x: 8
                y: 12
                width: 56
                height: 56
                styles: style_navbtn
                checkable: true
                checked:
                  bg_color: 0x12263F
                  bg_opa: COVER
                  text_color: 0x10B981
                on_click:
                  - lvgl.page.show:
                      id: page_home
                      animation: FADE_IN
                      time: 250ms
                widgets:
                  - label: {text: "${mdi_home}", text_font: mdi_28, align: CENTER}
            - button:
                id: nav_1
                x: 8
                y: 104
                width: 56
                height: 56
                styles: style_navbtn
                checkable: true
                checked:
                  bg_color: 0x12263F
                  bg_opa: COVER
                  text_color: 0xF59E0B
                on_click:
                  - lvgl.page.show:
                      id: page_lumieres
                      animation: FADE_IN
                      time: 250ms
                widgets:
                  - label: {text: "${mdi_bulb}", text_font: mdi_28, align: CENTER}
            - button:
                id: nav_2
                x: 8
                y: 196
                width: 56
                height: 56
                styles: style_navbtn
                checkable: true
                checked:
                  bg_color: 0x12263F
                  bg_opa: COVER
                  text_color: 0x06B6D4
                on_click:
                  - lvgl.page.show:
                      id: page_climat
                      animation: FADE_IN
                      time: 250ms
                widgets:
                  - label: {text: "${mdi_therm}", text_font: mdi_28, align: CENTER}
            - button:
                id: nav_3
                x: 8
                y: 288
                width: 56
                height: 56
                styles: style_navbtn
                checkable: true
