substitutions:
  name: tablette-esp
  lamp_entity: light.tasmota
  # PIR HC-SR501 : broche de sortie (à confirmer) et durée avant extinction de l'écran
  pir_pin: GPIO6
  screen_timeout: 5min
  # Codes des icônes MDI
  mdi_home: "\U000F02DC"
  mdi_bulb: "\U000F0335"
  mdi_therm: "\U000F050F"
  mdi_shield: "\U000F068A"
  mdi_paw: "\U000F03E9"
  mdi_plug: "\U000F06A5"
  mdi_drop: "\U000F058E"
  mdi_gauge: "\U000F029A"
  mdi_speaker: "\U000F04C3"
  mdi_phone: "\U000F011C"
  mdi_tablet: "\U000F04F7"
  mdi_battery: "\U000F0079"
  mdi_bed: "\U000F02E3"
  mdi_ceiling: "\U000F0769"
  mdi_cube: "\U000F01A7"
  mdi_volume: "\U000F057E"
  mdi_lock: "\U000F033E"
  mdi_sofa: "\U000F04B9"
  mdi_lamp: "\U000F06B5"
  mdi_cat: "\U000F011B"
  mdi_cctv: "\U000F07AE"
  mdi_sun: "\U000F0599"
  mdi_cloud: "\U000F0590"
  mdi_pcloud: "\U000F0595"
  mdi_rain: "\U000F0597"
  mdi_pour: "\U000F0596"
  mdi_snow: "\U000F0598"
  mdi_fog: "\U000F0591"
  mdi_night: "\U000F0594"
  mdi_bolt: "\U000F0593"
  mdi_wind: "\U000F059D"

esphome:
  name: ${name}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      - script.execute: screen_wake

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret ap_password

captive_portal:

# ---------- Heure (depuis Home Assistant) ----------
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lvgl.label.update:
          id: hdr_time
          text:
            format: "%s"
            args: ['id(ha_time).now().strftime("%H:%M").c_str()']
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: hdr_time
              text:
                format: "%s"
                args: ['id(ha_time).now().strftime("%H:%M").c_str()']

# ---------- Image de la caméra ----------
http_request:
  timeout: 8s

online_image:
  - id: camera_img
    url: !secret camera_url
    format: JPEG
    type: RGB565
    resize: 480x270
    request_headers:
      Authorization: !secret ha_bearer
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: img_cam
          src: camera_img
    on_error:
      - logger.log: "Echec du telechargement de l'image camera"

# ---------- Polices ----------
font:
  - file: "gfonts://Roboto"
    id: r16
    size: 16
    glyphsets: [GF_Latin_Core]
    glyphs: ["°"]
  - file: "gfonts://Roboto"
    id: r22
    size: 22
    glyphsets: [GF_Latin_Core]
    glyphs: ["°"]
  - file: "gfonts://Roboto"
    id: r28
    size: 28
    glyphsets: [GF_Latin_Core]
    glyphs: ["°"]
  - file: "gfonts://Roboto"
    id: r40
    size: 40
    glyphsets: [GF_Latin_Core]
    glyphs: ["°"]
  - file: "gfonts://Roboto"
    id: r56
    size: 56
    glyphsets: [GF_Latin_Core]
    glyphs: ["°"]
  # Grands chiffres des températures (chiffres seulement, pour économiser la flash)
  - file: "gfonts://Roboto"
    id: r72
    size: 72
    glyphs: "0123456789.,-° "

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_28
    size: 28
    glyphs: &mdi_glyphs
      - "${mdi_home}"
      - "${mdi_bulb}"
      - "${mdi_therm}"
      - "${mdi_shield}"
      - "${mdi_paw}"
      - "${mdi_plug}"
      - "${mdi_drop}"
      - "${mdi_gauge}"
      - "${mdi_speaker}"
      - "${mdi_phone}"
      - "${mdi_tablet}"
      - "${mdi_battery}"
      - "${mdi_bed}"
      - "${mdi_ceiling}"
      - "${mdi_cube}"
      - "${mdi_volume}"
      - "${mdi_lock}"
      - "${mdi_sofa}"
      - "${mdi_lamp}"
      - "${mdi_cat}"
      - "${mdi_cctv}"
      - "${mdi_sun}"
      - "${mdi_cloud}"
      - "${mdi_pcloud}"
      - "${mdi_rain}"
      - "${mdi_pour}"
      - "${mdi_snow}"
      - "${mdi_fog}"
      - "${mdi_night}"
      - "${mdi_bolt}"
      - "${mdi_wind}"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_40
    size: 40
    glyphs: *mdi_glyphs
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_64
    size: 64
    glyphs: *mdi_glyphs

# ---------- Matériel ----------
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

ch422g:
  - id: ch422g_hub

output:
  - platform: gpio
    id: backlight_out
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true

light:
  - platform: binary
    name: "Ecran retroeclairage"
    id: backlight
    output: backlight_out
    restore_mode: ALWAYS_ON
    on_turn_on:
      - script.execute: screen_wake

display:
  - platform: rpi_dpi_rgb
    id: main_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 16MHz
    pclk_inverted: true
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO5
    hsync_pin: GPIO46
    vsync_pin: GPIO3
    pclk_pin: GPIO7
    hsync_pulse_width: 4
    hsync_back_porch: 8
    hsync_front_porch: 8
    vsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    reset_pin:
      ch422g: ch422g_hub
      number: 3
      mode:
        output: true
    data_pins:
      red: [GPIO1, GPIO2, GPIO42, GPIO41, GPIO40]
      green: [GPIO39, GPIO0, GPIO45, GPIO48, GPIO47, GPIO21]
      blue: [GPIO14, GPIO38, GPIO18, GPIO17, GPIO10]

touchscreen:
  - platform: gt911
    id: touch
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
      mode:
        output: true
    on_touch:
      - script.execute: screen_wake

# ---------- Animations (timer ~10 images/s) + maintien écran allumé si présence ----------
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static int k = 0;
          k = (k + 1) % 40;
          int tri = k < 20 ? k : 40 - k;
          int k2 = (k * 2) % 40;
          int tri2 = k2 < 20 ? k2 : 40 - k2;

          struct G { lv_obj_t *card; lv_obj_t *sw; uint32_t col; bool fast; };
          G gl[] = {
            {id(card_lampe), id(sw_lampe), 0xF59E0B, false},
            {id(card_chauffage), id(sw_chauffage), 0xF97316, false},
            {id(card_sono_home), id(sw_sono_home), 0x8B5CF6, false},
            {id(dm_cadre), id(sw_cadre), 0xF59E0B, false},
            {id(dm_buffet), id(sw_buffet), 0xFBBF24, false},
            {id(dm_plafond), id(sw_plafond), 0x3B82F6, false},
            {id(dm_matrice), id(sw_matrice), 0x8B5CF6, false},
            {id(dm_cube), id(sw_cube), 0x06B6D4, false},
            {id(card_alarme_sec), id(sw_alarme_sec), 0xEF4444, true},
            {id(card_alarme_auto), id(sw_alarme_auto), 0x8B5CF6, false},
            {id(card_prise_sono), id(sw_prise_sono), 0x8B5CF6, false},
            {id(card_relais_zw), id(sw_relais_zw), 0x10B981, false},
          };
          for (auto &g : gl) {
            bool on = lv_obj_has_state(g.sw, LV_STATE_CHECKED);
            lv_obj_set_style_shadow_color(g.card, lv_color_hex(g.col), 0);
            lv_obj_set_style_shadow_opa(g.card, on ? LV_OPA_50 : LV_OPA_TRANSP, 0);
            lv_obj_set_style_border_color(g.card, lv_color_hex(g.col), 0);
            lv_obj_set_style_border_opa(g.card, on ? LV_OPA_80 : LV_OPA_30, 0);
            if (on) lv_obj_set_style_shadow_width(g.card, 4 + (g.fast ? tri2 : tri), 0);
          }

          lv_obj_set_style_translate_y(id(lbl_meteo_icon), tri / 2 - 5, 0);
          lv_obj_set_style_text_opa(id(splash_icon), 90 + tri * 8, 0);

  # Tant que le PIR détecte une présence, on repousse l'extinction de l'écran
  - interval: 10s
    then:
      - if:
          condition:
            binary_sensor.is_on: pir
          then:
            - script.execute: screen_wake

# ---------- Scripts ----------
script:
  - id: set_nav
    parameters:
      idx: int
      title: string
    then:
      - lvgl.label.update:
          id: hdr_title
          text: !lambda return title;
      - text_sensor.template.publish:
          id: ts_page
          state: !lambda return title;
      - lvgl.widget.update:
          id: nav_0
          state:
            checked: !lambda return idx == 0;
      - lvgl.widget.update:
          id: nav_1
          state:
            checked: !lambda return idx == 1;
      - lvgl.widget.update:
          id: nav_2
          state:
            checked: !lambda return idx == 2;
      - lvgl.widget.update:
          id: nav_3
          state:
            checked: !lambda return idx == 3;
      - lvgl.widget.update:
          id: nav_5
          state:
            checked: !lambda return idx == 5;

  # Allume l'écran, puis l'éteint après ${screen_timeout} sans mouvement ni toucher
  - id: screen_wake
    mode: restart
    then:
      - light.turn_on: backlight
      - delay: ${screen_timeout}
      - light.turn_off: backlight

  # Rafraîchit l'image de la caméra tant que la page Caméra est affichée
  - id: cam_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - component.update: camera_img
            - delay: 3s

  # Envoie une couleur à la lumière choisie (color_target) puis ferme la palette
  - id: set_color
    parameters:
      red: int
      green: int
      blue: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return id(color_target);'
          data_template:
            rgb_color: "[{{ r }}, {{ g }}, {{ b }}]"
          variables:
            r: 'return to_string(red);'
            g: 'return to_string(green);'
            b: 'return to_string(blue);'
      - lvgl.widget.hide: color_popup

  # Colore la pastille d'une lumière à partir de l'attribut rgb_color reçu de HA
  - id: paint_swatch
    mode: queued
    parameters:
      idx: int
      rgb: string
    then:
      - lambda: |-
          lv_obj_t *sw[] = {id(col_cadre), id(col_buffet), id(col_plafond), id(col_matrice), id(col_cube)};
          if (idx < 0 || idx > 4) return;
          int v[3] = {0, 0, 0}, n = 0, cur = -1;
          for (char c : rgb) {
            if (c >= '0' && c <= '9') cur = (cur < 0 ? 0 : cur * 10) + (c - '0');
            else if (cur >= 0) { if (n < 3) v[n++] = cur; cur = -1; }
          }
          if (cur >= 0 && n < 3) v[n++] = cur;
          if (n == 3) lv_obj_set_style_bg_color(sw[idx], lv_color_make(v[0], v[1], v[2]), 0);

  # Dessine les prévisions de la page Météo
  - id: draw_forecast
    mode: restart
    then:
      - lambda: |-
          auto split = [](const std::string &s) {
            std::vector<std::string> out;
            size_t st = 0;
            while (true) {
              size_t p = s.find(',', st);
              if (p == std::string::npos) { out.push_back(s.substr(st)); break; }
              out.push_back(s.substr(st, p - st));
              st = p + 1;
            }
            return out;
          };
          auto cond = split(id(ts_fc_cond).state);
          auto smax = split(id(ts_fc_tmax).state);
          auto smin = split(id(ts_fc_tmin).state);
          auto srain = split(id(ts_fc_rain).state);
          auto swsp = split(id(ts_fc_wspd).state);
          auto swdir = split(id(ts_fc_wdir).state);
          auto sdow = split(id(ts_fc_dow).state);
          if (cond.size() < 6 || smax.size() < 6 || smin.size() < 6 || srain.size() < 6 ||
              swsp.size() < 6 || swdir.size() < 6 || sdow.size() < 6) return;

          lv_obj_t *day[] = {id(lbl_d0), id(lbl_d1), id(lbl_d2), id(lbl_d3), id(lbl_d4), id(lbl_d5)};
          lv_obj_t *icn[] = {id(lbl_i0), id(lbl_i1), id(lbl_i2), id(lbl_i3), id(lbl_i4), id(lbl_i5)};
          lv_obj_t *hi[] = {id(lbl_h0), id(lbl_h1), id(lbl_h2), id(lbl_h3), id(lbl_h4), id(lbl_h5)};
          lv_obj_t *lo[] = {id(lbl_l0), id(lbl_l1), id(lbl_l2), id(lbl_l3), id(lbl_l4), id(lbl_l5)};
          lv_obj_t *dh[] = {id(dot_h0), id(dot_h1), id(dot_h2), id(dot_h3), id(dot_h4), id(dot_h5)};
          lv_obj_t *dl[] = {id(dot_l0), id(dot_l1), id(dot_l2), id(dot_l3), id(dot_l4), id(dot_l5)};
          lv_obj_t *rn[] = {id(lbl_r0), id(lbl_r1), id(lbl_r2), id(lbl_r3), id(lbl_r4), id(lbl_r5)};
          lv_obj_t *ring[] = {id(ring_0), id(ring_1), id(ring_2), id(ring_3), id(ring_4), id(ring_5)};
          lv_obj_t *wsp[] = {id(lbl_w0), id(lbl_w1), id(lbl_w2), id(lbl_w3), id(lbl_w4), id(lbl_w5)};
          lv_obj_t *wdr[] = {id(lbl_wd0), id(lbl_wd1), id(lbl_wd2), id(lbl_wd3), id(lbl_wd4), id(lbl_wd5)};

          lv_obj_t *mh[5][5] = {
            {id(mh_0_0), id(mh_0_1), id(mh_0_2), id(mh_0_3), id(mh_0_4)},
            {id(mh_1_0), id(mh_1_1), id(mh_1_2), id(mh_1_3), id(mh_1_4)},
            {id(mh_2_0), id(mh_2_1), id(mh_2_2), id(mh_2_3), id(mh_2_4)},
            {id(mh_3_0), id(mh_3_1), id(mh_3_2), id(mh_3_3), id(mh_3_4)},
            {id(mh_4_0), id(mh_4_1), id(mh_4_2), id(mh_4_3), id(mh_4_4)}};
          lv_obj_t *ml[5][5] = {
            {id(ml_0_0), id(ml_0_1), id(ml_0_2), id(ml_0_3), id(ml_0_4)},
            {id(ml_1_0), id(ml_1_1), id(ml_1_2), id(ml_1_3), id(ml_1_4)},
            {id(ml_2_0), id(ml_2_1), id(ml_2_2), id(ml_2_3), id(ml_2_4)},
            {id(ml_3_0), id(ml_3_1), id(ml_3_2), id(ml_3_3), id(ml_3_4)},
            {id(ml_4_0), id(ml_4_1), id(ml_4_2), id(ml_4_3), id(ml_4_4)}};

          auto fmt = [](float v) {
            char b[16];
            snprintf(b, sizeof(b), "%.1f", v);
            for (char *p = b; *p; ++p) if (*p == '.') *p = ',';
            return std::string(b);
          };

          float th[6], tl[6];
          for (int i = 0; i < 6; i++) { th[i] = atof(smax[i].c_str()); tl[i] = atof(smin[i].c_str()); }
          float vmin = tl[0], vmax = th[0];
          for (int i = 0; i < 6; i++) {
            vmin = fminf(vmin, fminf(tl[i], th[i]));
            vmax = fmaxf(vmax, fmaxf(tl[i], th[i]));
          }
          float span = vmax - vmin;
          if (span < 1.0f) span = 1.0f;
          const int top = 272, bot = 332;

          const char *dn[] = {"lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."};
          const char *dirs[] = {"N", "NE", "E", "SE", "S", "SO", "O", "NO"};

          int yhs[6], yls[6];
          for (int i = 0; i < 6; i++) {
            int cx = 145 + 118 * i;
            int yh = (int) (top + (vmax - th[i]) / span * (bot - top));
            int yl = (int) (top + (vmax - tl[i]) / span * (bot - top));
            yhs[i] = yh;
            yls[i] = yl;
            lv_obj_set_pos(dh[i], cx - 5, yh - 5);
            lv_obj_set_pos(dl[i], cx - 5, yl - 5);
            lv_label_set_text(hi[i], (fmt(th[i]) + "°").c_str());
            lv_obj_set_y(hi[i], yh - 28);
            lv_label_set_text(lo[i], (fmt(tl[i]) + "°").c_str());
            lv_obj_set_y(lo[i], yl + 8);

            lv_label_set_text(day[i], dn[atoi(sdow[i].c_str()) % 7]);

            const std::string &c = cond[i];
            const char *ic = "\U000F0590";
            uint32_t col = 0xB0BEC5;
            if (c == "sunny")              { ic = "\U000F0599"; col = 0xFBBF24; }
            else if (c == "clear-night")   { ic = "\U000F0594"; col = 0xFDE68A; }
            else if (c == "partlycloudy")  { ic = "\U000F0595"; col = 0xFDE68A; }
            else if (c == "cloudy")        { ic = "\U000F0590"; col = 0xB0BEC5; }
            else if (c == "rainy")         { ic = "\U000F0597"; col = 0x38BDF8; }
            else if (c == "pouring")       { ic = "\U000F0596"; col = 0x3B82F6; }
            else if (c == "snowy")         { ic = "\U000F0598"; col = 0xE0F2FE; }
            else if (c == "fog")           { ic = "\U000F0591"; col = 0xCBD5E1; }
            else if (c == "windy")         { ic = "\U000F059D"; col = 0x06B6D4; }
            else if (c == "lightning" || c == "lightning-rainy") { ic = "\U000F0593"; col = 0xFACC15; }
            lv_label_set_text(icn[i], ic);
            lv_obj_set_style_text_color(icn[i], lv_color_hex(col), 0);

            char b[20];
            float r = atof(srain[i].c_str());
            if (r > 0.05f) {
              snprintf(b, sizeof(b), "%.1f mm", r);
              for (char *p = b; *p; ++p) if (*p == '.') *p = ',';
            } else {
              b[0] = 0;
            }
            lv_label_set_text(rn[i], b);

            int ws = atoi(swsp[i].c_str());
            uint32_t rc = ws < 12 ? 0x10B981 : (ws < 30 ? 0xF59E0B : 0xEF4444);
            lv_obj_set_style_border_color(ring[i], lv_color_hex(rc), 0);
            snprintf(b, sizeof(b), "%d", ws);
            lv_label_set_text(wsp[i], b);
            float deg = atof(swdir[i].c_str());
            int di = ((int) ((deg + 22.5f) / 45.0f)) % 8;
            lv_label_set_text(wdr[i], deg > 0 ? dirs[di] : " ");
          }

          // Courbes : petits points interpolés (courbe adoucie) entre deux jours
          for (int s = 0; s < 5; s++) {
            int x0 = 145 + 118 * s;
            for (int j = 0; j < 5; j++) {
              float f = (j + 1) / 6.0f;
              float g = (1.0f - cosf(f * 3.14159265f)) * 0.5f;
              int x = x0 + (int) (118.0f * f);
              int yh = yhs[s] + (int) ((yhs[s + 1] - yhs[s]) * g);
              int yl = yls[s] + (int) ((yls[s + 1] - yls[s]) * g);
              lv_obj_set_pos(mh[s][j], x - 2, yh - 2);
              lv_obj_set_pos(ml[s][j], x - 2, yl - 2);
            }
          }

          lv_label_set_text(id(lbl_wm_minmax), (fmt(th[0]) + "°C / " + fmt(tl[0]) + "°C").c_str());

# ---------- Données Home Assistant : capteurs ----------
sensor:
  - platform: homeassistant
    id: temp_chambre
    entity_id: sensor.bedroom_sensor_chambre_air_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_chambre
          text:
            format: "%.1f"
            args: ["x"]
      - lvgl.label.update:
          id: lbl_chambre_clim
          text:
            format: "%.1f"
            args: ["x"]
      - lambda: |-
          uint32_t c = x < 17 ? 0x38BDF8 : (x < 23 ? 0x10B981 : 0xF97316);
          lv_obj_set_style_text_color(id(ic_chambre), lv_color_hex(c), 0);
          lv_obj_set_style_bg_color(id(ln_chambre), lv_color_hex(c), 0);
          lv_obj_set_style_text_color(id(ic_chambre_clim), lv_color_hex(c), 0);
          lv_obj_set_style_bg_color(id(ln_chambre_clim), lv_color_hex(c), 0);

  - platform: homeassistant
    id: temp_salon
    entity_id: sensor.living_room_temperature_salon_air_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_salon_clim
          text:
            format: "%.1f"
            args: ["x"]
      - lvgl.label.update:
          id: lbl_salon
          text:
