# ---------- Changer de page depuis Home Assistant ----------
select:
  - platform: template
    id: sel_page
    name: "Aller a la page"
    optimistic: true
    options:
      - Accueil
      - Lumieres
      - Climat
      - Securite
      - Maison
      - Meteo
    initial_option: Accueil
    set_action:
      - script.execute: screen_wake
      - if:
          condition:
            lambda: 'return x == "Accueil";'
          then:
            - lvgl.page.show: page_home
      - if:
          condition:
            lambda: 'return x == "Lumieres";'
          then:
            - lvgl.page.show: page_lumieres
      - if:
          condition:
            lambda: 'return x == "Climat";'
          then:
            - lvgl.page.show: page_climat
      - if:
          condition:
            lambda: 'return x == "Securite";'
          then:
            - lvgl.page.show: page_securite
      - if:
          condition:
            lambda: 'return x == "Maison";'
          then:
            - lvgl.page.show: page_maison
      - if:
          condition:
            lambda: 'return x == "Meteo";'
          then:
            - lvgl.page.show: page_meteo

# ---------- PIR + états on/off Home Assistant ----------
binary_sensor:
  # Capteur de mouvement HC-SR501 (sortie 3,3 V sur ${pir_pin})
  - platform: gpio
    id: pir
    name: "Mouvement"
    device_class: motion
    pin:
      number: ${pir_pin}
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_off: 5s
    on_state:
      - lambda: |-
          lv_obj_set_style_text_color(id(hdr_pir), lv_color_hex(x ? 0x10B981 : 0x334155), 0);
      - script.execute: screen_wake

  - platform: homeassistant
