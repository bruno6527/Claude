  pages:
    # ===================== DÉMARRAGE =====================
    - id: page_splash
      bg_color: 0x08142D
      bg_opa: 100%
      text_color: 0xF1F5F9
      on_load:
        - lvgl.widget.hide: nav_bar
        - lvgl.widget.hide: hdr_bar
        - delay: 2200ms
        - lvgl.widget.show: nav_bar
        - lvgl.widget.show: hdr_bar
        - lvgl.page.show:
            id: page_home
            animation: FADE_IN
            time: 600ms
      widgets:
        - label: {id: splash_icon, text: "${mdi_home}", text_font: mdi_64, text_color: 0x06B6D4, align: CENTER, y: -40}
        - label: {text: "Maison", text_font: r40, text_color: 0xF1F5F9, align: CENTER, y: 40}

    # ===================== ACCUEIL =====================
    - id: page_home
      bg_color: 0x08142D
      bg_opa: 100%
      text_color: 0xF1F5F9
      on_load:
        - script.execute:
            id: set_nav
            idx: 0
            title: "Accueil"
      widgets:
        # Météo (cliquable : ouvre la page Météo)
