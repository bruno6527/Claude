text_sensor:
  - platform: homeassistant
    id: meteo_cond
    entity_id: weather.forecast_home
    on_value:
      - lambda: |-
          const char *icon = "\U000F0590";
          std::string txt = x;
          uint32_t col = 0xB0BEC5;
          if (x == "sunny")              { icon = "\U000F0599"; txt = "Ensoleillé";    col = 0xFBBF24; }
          else if (x == "clear-night")   { icon = "\U000F0594"; txt = "Nuit dégagée";  col = 0xFDE68A; }
          else if (x == "partlycloudy")  { icon = "\U000F0595"; txt = "Peu nuageux";   col = 0xFDE68A; }
          else if (x == "cloudy")        { icon = "\U000F0590"; txt = "Nuageux";       col = 0xB0BEC5; }
          else if (x == "rainy")         { icon = "\U000F0597"; txt = "Pluie";         col = 0x38BDF8; }
          else if (x == "pouring")       { icon = "\U000F0596"; txt = "Forte pluie";   col = 0x3B82F6; }
          else if (x == "snowy")         { icon = "\U000F0598"; txt = "Neige";         col = 0xE0F2FE; }
          else if (x == "fog")           { icon = "\U000F0591"; txt = "Brouillard";    col = 0xCBD5E1; }
          else if (x == "windy")         { icon = "\U000F059D"; txt = "Venteux";       col = 0x06B6D4; }
          else if (x == "lightning" || x == "lightning-rainy") { icon = "\U000F0593"; txt = "Orage"; col = 0xFACC15; }
          lv_label_set_text(id(lbl_meteo_cond), txt.c_str());
          lv_label_set_text(id(lbl_meteo_icon), icon);
          lv_obj_set_style_text_color(id(lbl_meteo_icon), lv_color_hex(col), 0);
          lv_label_set_text(id(lbl_wm_cond), txt.c_str());
          lv_label_set_text(id(lbl_wm_icon), icon);
          lv_obj_set_style_text_color(id(lbl_wm_icon), lv_color_hex(col), 0);

