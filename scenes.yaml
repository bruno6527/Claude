# Ambiances d'éclairage du salon
# Luminosité : 0 à 255 (5 % = 13, 10 % = 26, 15 % = 38, 30 % = 77, 40 % = 102,
# 50 % = 128, 60 % = 153, 70 % = 179, 80 % = 204, 90 % = 230, 100 % = 255)
# Couleurs : ambre [255,147,41], orange [255,110,20], rouge-orange [255,60,10],
# blanc chaud [255,180,107] (~2700 K), blanc neutre [255,228,206] (~4000 K)
# « effect: Solid » remet les WLED en couleur fixe après le mode Fête.
# Plafond et Matrice sont ignorés quand l'interrupteur mural est coupé.

- id: scene_cinema
  name: Cinéma
  icon: mdi:movie-open
  entities:
    light.living_room_cadre_wled:
      state: "on"
      effect: Solid
      brightness: 26
      rgb_color: [255, 147, 41]
    light.buffet_groupe:
      state: "on"
      brightness: 38
      rgb_color: [255, 147, 41]
    light.wled_2:
      state: "off"
    light.wled_3:
      state: "off"
    light.living_room_cube_wled_main:
      state: "on"
      effect: Solid
      brightness: 26
      rgb_color: [255, 110, 20]
    switch.tasmota:
      state: "off"

