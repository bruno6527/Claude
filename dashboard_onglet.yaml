  - title: Téléphone
    path: telephone
    icon: mdi:cellphone
    type: sections
    max_columns: 2
    background: linear-gradient(160deg,#0f2027,#203a43 50%,#2c5364) fixed
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Samsung
            heading_style: title
            icon: mdi:cellphone
          - type: tile
            entity: person.bruno
            card_mod:
              style: >-
                ha-card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px
                solid rgba(255,255,255,.12);border-radius:22px}
          - type: tile
            entity: sensor.sm_a528b_bluetooth_connection
            card_mod:
              style: >-
                ha-card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px
                solid rgba(255,255,255,.12);border-radius:22px}
          - type: tile
            entity: sensor.sm_a528b_battery_level
            features:
              - type: bar-gauge
            card_mod:
              style: >
                @keyframes b{50%{opacity:.55}}

                {% set v = states('sensor.sm_a528b_battery_level') | float(100)
                %}{% set c = '#ef5350' if v < 20 else ('#ffa726' if v < 50 else
                '#66bb6a') %}

                ha-card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px
                solid rgba(255,255,255,.12);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }};{% if v < 20
                %}animation:b 1.4s infinite{% endif %}}
          - type: tile
            entity: sensor.sm_a528b_daily_steps
            card_mod:
              style: >-
                ha-card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px
                solid rgba(255,255,255,.12);border-left:5px solid
                #26a69a;border-radius:22px;--tile-color:#26a69a}
          - type: tile
            entity: sensor.sm_a528b_steps_sensor
            card_mod:
              style: >-
                ha-card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px
                solid rgba(255,255,255,.12);border-left:5px solid
                #26a69a;border-radius:22px;--tile-color:#26a69a}
          - type: history-graph
            hours_to_show: 24
            entities:
              - sensor.sm_a528b_battery_level
            grid_options:
              columns: 12
              rows: 3
            card_mod:
              style: >-
                ha-card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px
                solid rgba(255,255,255,.12);border-radius:22px}
      - type: grid
        cards:
          - type: heading
            heading: Position
            heading_style: title
            icon: mdi:map-marker
          - type: map
            entities:
              - entity: person.bruno
                label_mode: name
            auto_fit: true
            default_zoom: 15
            theme_mode: dark
            hours_to_show: 24
            grid_options:
              columns: 12
              rows: 6
            card_mod:
              style: >-
                ha-card{border:1px solid
                rgba(255,255,255,.12);border-radius:22px;overflow:hidden}
