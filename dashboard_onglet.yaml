title: Maison
views:
  # =====================================================================
  # ACCUEIL : l'essentiel en un coup d'œil
  # =====================================================================
  - title: Accueil
    path: accueil
    icon: mdi:home
    type: sections
    max_columns: 4
    background: &bg >-
      radial-gradient(1100px 600px at 0% -10%,rgba(6,182,212,.10),transparent 60%),
      radial-gradient(900px 520px at 110% 0%,rgba(139,92,246,.10),transparent 60%),
      linear-gradient(160deg,#050b18 0%,#08142d 55%,#0b1a33 100%) fixed
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aperçu
            heading_style: title
            icon: mdi:view-dashboard
            badges:
              - type: entity
                entity: person.bruno
                show_state: true
                show_icon: true
              - type: entity
                entity: sensor.living_room_temperature_salon_air_temperature
                show_state: true
                show_icon: true
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
            grid_options:
              columns: 12
            card_mod:
              style: &glass >-
                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-radius:22px}
          - type: button
            entity: input_boolean.mode_alarme
            name: Alarme
            icon: mdi:shield-home
            show_state: true
            tap_action:
              action: toggle
            card_mod:
              style: &alarm >
                @keyframes p{0%,100%{box-shadow:0 0 0 0
                rgba(239,83,80,.65)}50%{box-shadow:0 0 26px 8px
                rgba(239,83,80,.55)}}

                ha-card{backdrop-filter:blur(14px);border-radius:22px;{% if
                is_state('input_boolean.mode_alarme','on')
                %}background:linear-gradient(135deg,rgba(198,40,40,.85),rgba(239,83,80,.75));border:1px
                solid
                rgba(255,255,255,.35);color:#fff;--paper-item-icon-color:#fff;animation:p
                2s ease-in-out infinite{% else
                %}background:rgba(13,23,42,.72);border:1px solid
                rgba(148,163,184,.16);--paper-item-icon-color:#81c784{% endif
                %}}
          - type: button
            name: Croquettes
            icon: mdi:paw
            tap_action:
              action: perform-action
              perform_action: rest_command.croquettes
              confirmation:
                text: Donner des croquettes à Pierrette ?
            card_mod:
              style: &croq >-
                ha-card{background:linear-gradient(135deg,rgba(255,138,101,.30),rgba(255,204,128,.18));backdrop-filter:blur(14px);border:1px
                solid
                rgba(255,204,128,.30);border-radius:22px;--paper-item-icon-color:#ffab91}

      - type: grid
        cards:
          - type: heading
            heading: Températures
            heading_style: title
            icon: mdi:thermometer
            tap_action:
              action: navigate
              navigation_path: climat
          - type: tile
            entity: sensor.living_room_temperature_salon_air_temperature
            name: Salon
            icon: mdi:sofa
            card_mod:
              style: &temp_salon >
                {% set t = states('sensor.living_room_temperature_salon_air_temperature') | float(20)
                %}{% set c = '#4fc3f7' if t < 18 else ('#66bb6a' if t < 24 else
                '#ff7043') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }}}
          - type: tile
            entity: sensor.bedroom_sensor_chambre_air_temperature
            name: Chambre
            icon: mdi:bed
            card_mod:
              style: &temp_chambre >
                {% set t = states('sensor.bedroom_sensor_chambre_air_temperature') | float(19)
                %}{% set c = '#4fc3f7' if t < 17 else ('#66bb6a' if t < 23 else
                '#ff7043') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }}}
          - type: tile
            entity: sensor.temperature_sdb_corrigee
            name: Salle de bain
            icon: mdi:shower
            card_mod:
              style: &temp_sdb >
                {% set t = states('sensor.temperature_sdb_corrigee') | float(20)
                %}{% set c = '#4fc3f7' if t < 18 else ('#66bb6a' if t < 24 else
                '#ff7043') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }}}
          - type: tile
            entity: sensor.salle_de_bain_tasmota_salle_de_bain_am2301_13_temperature
            name: Extérieur
            icon: mdi:home-thermometer-outline
            card_mod:
              style: &temp_ext >
                {% set t = states('sensor.salle_de_bain_tasmota_salle_de_bain_am2301_13_temperature')
                | float(15) %}{% set c = '#4fc3f7' if t < 10 else ('#66bb6a' if
                t < 25 else '#ff7043') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }}}

      - type: grid
        cards:
          - type: heading
            heading: Lumières
            heading_style: title
            icon: mdi:lightbulb-group-outline
            tap_action:
              action: navigate
              navigation_path: eclairage
          - type: tile
            entity: light.living_room_cadre_wled
            name: Cadre
            features:
              - type: light-brightness
            card_mod:
              style: *glass
          - type: tile
            entity: light.buffet_groupe
            name: Buffet
            features:
              - type: light-brightness
            card_mod:
              style: *glass
          # Masqué quand l'interrupteur mural est coupé (WLED hors ligne)
          - type: tile
            entity: light.wled_2
            name: Plafond
            visibility: &vis_plafond
              - condition: state
                entity: light.wled_2
                state_not: unavailable
            features:
              - type: light-brightness
            card_mod:
              style: *glass
          - type: tile
            entity: light.wled_3
            name: Plafond Matrice
            visibility: &vis_matrice
              - condition: state
                entity: light.wled_3
                state_not: unavailable
            features:
              - type: light-brightness
            card_mod:
              style: *glass
          - type: tile
            entity: light.living_room_cube_wled_main
            name: Cube
            features:
              - type: light-brightness
            card_mod:
              style: *glass
          # Lampe branchée sur la prise Tasmota
          - type: tile
            entity: switch.tasmota
            name: Lampe
            icon: mdi:lamp
            features:
              - type: toggle
            card_mod:
              style: &glow_tasmota >
                @keyframes g{0%,100%{box-shadow:0 0 8px
                rgba(255,179,0,.35)}50%{box-shadow:0 0 24px
                rgba(255,179,0,.75)}}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-radius:22px;{% if
                is_state('switch.tasmota','on')
                %}--tile-color:#ffb300;animation:g 2.6s ease-in-out infinite{%
                endif %}}
          - type: button
            name: Tout éteindre
            icon: mdi:lightbulb-group-off
            tap_action:
              action: perform-action
              perform_action: homeassistant.turn_off
              target:
                entity_id:
                  - light.living_room_cadre_wled
                  - light.buffet_groupe
                  - light.wled_2
                  - light.wled_3
                  - light.living_room_cube_wled_main
                  - switch.tasmota
            grid_options:
              columns: 12
              rows: 1
            card_mod:
              style: &btn_off >-
                ha-card{background:rgba(239,83,80,.14);border:1px solid
                rgba(239,83,80,.40);border-radius:22px;--paper-item-icon-color:#ef9a9a}

      - type: grid
        cards:
          - type: heading
            heading: Prises et chauffage
            heading_style: title
            icon: mdi:power-socket-eu
          - type: tile
            entity: switch.tasmota_3
            name: Chauffage SDB
            icon: mdi:radiator
            features:
              - type: toggle
            card_mod:
              style: &glow_chauffage >
                @keyframes g{0%,100%{box-shadow:0 0 8px
                rgba(249,115,22,.35)}50%{box-shadow:0 0 24px
                rgba(249,115,22,.75)}}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-radius:22px;{% if
                is_state('switch.tasmota_3','on')
                %}--tile-color:#f97316;animation:g 2.6s ease-in-out infinite{%
                endif %}}
          - type: tile
            entity: switch.tasmota_2
            name: Prise sono
            icon: mdi:speaker
            features:
              - type: toggle
            card_mod:
              style: *glass
          - type: tile
            entity: switch.relay_switch_1x2_5kw
            name: Relais Z-Wave
            icon: mdi:electric-switch
            features:
              - type: toggle
            card_mod:
              style: *glass

      # Visible uniquement pendant une impression
      - type: grid
        visibility:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.bureau_snapmaker_u1_current_print_state
                state: printing
              - condition: state
                entity: sensor.bureau_snapmaker_u1_current_print_state
                state: paused
        cards:
          - type: heading
            heading: Impression 3D en cours
            heading_style: title
            icon: mdi:printer-3d-nozzle
            tap_action:
              action: navigate
              navigation_path: bureau
          - type: tile
            entity: sensor.bureau_snapmaker_u1_progress
            name: Progression
            icon: mdi:progress-clock
            features:
              - type: bar-gauge
            card_mod:
              style: &glass_cyan >-
                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid
                #06b6d4;border-radius:22px;--tile-color:#06b6d4}
          - type: tile
            entity: sensor.bureau_snapmaker_u1_print_time_left
            name: Temps restant
            icon: mdi:timer-sand
            card_mod:
              style: *glass_cyan

      - type: grid
        cards:
          - type: heading
            heading: Batteries
            heading_style: title
            icon: mdi:battery-heart-variant
          - type: tile
            entity: sensor.sm_a528b_battery_level
            name: Samsung
            features:
              - type: bar-gauge
            card_mod:
              style: &batt_samsung >
                @keyframes b{50%{opacity:.55}}

                {% set v = states('sensor.sm_a528b_battery_level') | float(100)
                %}{% set c = '#ef5350' if v < 20 else ('#ffa726' if v < 50 else
                '#66bb6a') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }};{% if v < 20
                %}animation:b 1.4s infinite{% endif %}}
          - type: tile
            entity: sensor.tel_musique_battery_level
            name: Téléphone sono
            features:
              - type: bar-gauge
            card_mod:
              style: &batt_musique >
                @keyframes b{50%{opacity:.55}}

                {% set v = states('sensor.tel_musique_battery_level') |
                float(100) %}{% set c = '#ef5350' if v < 20 else ('#ffa726' if v
                < 50 else '#66bb6a') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }};{% if v < 20
                %}animation:b 1.4s infinite{% endif %}}
          - type: tile
            entity: sensor.tablette_samsung_battery_level
            name: Tablette
            features:
              - type: bar-gauge
            card_mod:
              style: &batt_tablette >
                @keyframes b{50%{opacity:.55}}

                {% set v = states('sensor.tablette_samsung_battery_level') |
                float(100) %}{% set c = '#ef5350' if v < 20 else ('#ffa726' if v
                < 50 else '#66bb6a') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }};{% if v < 20
                %}animation:b 1.4s infinite{% endif %}}
          - type: tile
            entity: sensor.living_room_temperature_salon_battery_level
            name: Capteur salon
            features:
              - type: bar-gauge
            card_mod:
              style: &batt_salon >
                @keyframes b{50%{opacity:.55}}

                {% set v = states('sensor.living_room_temperature_salon_battery_level') |
                float(100) %}{% set c = '#ef5350' if v < 20 else ('#ffa726' if v
                < 50 else '#66bb6a') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }};{% if v < 20
                %}animation:b 1.4s infinite{% endif %}}
          - type: tile
            entity: sensor.bedroom_sensor_chambre_battery_level
            name: Capteur chambre
            features:
              - type: bar-gauge
            card_mod:
              style: &batt_chambre >
                @keyframes b{50%{opacity:.55}}

                {% set v = states('sensor.bedroom_sensor_chambre_battery_level') |
                float(100) %}{% set c = '#ef5350' if v < 20 else ('#ffa726' if v
                < 50 else '#66bb6a') %}

                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid {{ c
                }};border-radius:22px;--tile-color:{{ c }};{% if v < 20
                %}animation:b 1.4s infinite{% endif %}}

  # =====================================================================
  # ÉCLAIRAGE
  # =====================================================================
  - title: Éclairage
    path: eclairage
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 3
    background: *bg
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Salon
            heading_style: title
            icon: mdi:sofa
          - type: vertical-stack
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_cadre_wled
                name: Cadre
                use_light_color: true
                show_brightness_control: true
                show_color_control: true
                show_color_temp_control: true
                collapsible_controls: true
                card_mod:
                  style: &glass_top >-
                    ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                    solid rgba(148,163,184,.16);border-radius:22px 22px 0 0}
              - type: custom:mushroom-select-card
                entity: select.living_room_cadre_wled_preset
                name: Preset cadre
                icon: mdi:palette
                icon_type: icon
                card_mod:
                  style: &glass_bottom >-
                    ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                    solid rgba(148,163,184,.16);border-radius:0 0 22px 22px}
          - type: custom:mushroom-light-card
            entity: light.buffet_groupe
            name: Buffet
            use_light_color: true
            show_brightness_control: true
            show_color_control: true
            show_color_temp_control: true
            collapsible_controls: true
            card_mod:
              style: *glass
          # Lampe branchée sur la prise Tasmota
          - type: tile
            entity: switch.tasmota
            name: Lampe
            icon: mdi:lamp
            features:
              - type: toggle
            card_mod:
              style: *glow_tasmota

      # Masquée quand les deux WLED du plafond sont hors ligne (interrupteur coupé)
      - type: grid
        visibility:
          - condition: or
            conditions:
              - condition: state
                entity: light.wled_2
                state_not: unavailable
              - condition: state
                entity: light.wled_3
                state_not: unavailable
        cards:
          - type: heading
            heading: Plafond
            heading_style: title
            icon: mdi:ceiling-light
          - type: vertical-stack
            visibility: *vis_plafond
            cards:
              - type: custom:mushroom-light-card
                entity: light.wled_2
                name: Plafond
                use_light_color: true
                show_brightness_control: true
                show_color_control: true
                show_color_temp_control: true
                collapsible_controls: true
                card_mod:
                  style: *glass_top
              - type: custom:mushroom-select-card
                entity: select.wled_preset_2
                name: Preset plafond
                icon: mdi:palette
                icon_type: icon
                card_mod:
                  style: *glass_bottom
          - type: vertical-stack
            visibility: *vis_matrice
            cards:
              - type: custom:mushroom-light-card
                entity: light.wled_3
                name: Plafond Matrice
                use_light_color: true
                show_brightness_control: true
                show_color_control: true
                show_color_temp_control: true
                collapsible_controls: true
                card_mod:
                  style: *glass_top
              - type: custom:mushroom-select-card
                entity: select.wled_preset_3
                name: Preset matrice
                icon: mdi:palette
                icon_type: icon
                card_mod:
                  style: *glass_bottom

      - type: grid
        cards:
          - type: heading
            heading: Cube
            heading_style: title
            icon: mdi:cube-outline
          - type: vertical-stack
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_cube_wled_main
                name: Cube
                use_light_color: true
                show_brightness_control: true
                show_color_control: true
                show_color_temp_control: true
                collapsible_controls: true
                card_mod:
                  style: *glass_top
              - type: custom:mushroom-select-card
                entity: select.living_room_cube_wled_preset
                name: Preset cube
                icon: mdi:palette
                icon_type: icon
                card_mod:
                  style: *glass_bottom
          - type: button
            name: Tout éteindre
            icon: mdi:lightbulb-group-off
            tap_action:
              action: perform-action
              perform_action: homeassistant.turn_off
              target:
                entity_id:
                  - light.living_room_cadre_wled
                  - light.buffet_groupe
                  - light.wled_2
                  - light.wled_3
                  - light.living_room_cube_wled_main
                  - switch.tasmota
            grid_options:
              columns: 12
              rows: 1
            card_mod:
              style: *btn_off

  # =====================================================================
  # CLIMAT
  # =====================================================================
  - title: Climat
    path: climat
    icon: mdi:thermometer
    type: sections
    max_columns: 4
    background: *bg
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Salon
            heading_style: title
            icon: mdi:sofa
          - type: tile
            entity: sensor.living_room_temperature_salon_air_temperature
            name: Température
            card_mod:
              style: *temp_salon
          - type: tile
            entity: sensor.living_room_temperature_salon_illuminance
            name: Luminosité
            icon: mdi:brightness-6
            card_mod:
              style: &glass_yellow >-
                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid
                #ffd54f;border-radius:22px;--tile-color:#ffd54f}

      - type: grid
        cards:
          - type: heading
            heading: Chambre
            heading_style: title
            icon: mdi:bed
          - type: tile
            entity: sensor.bedroom_sensor_chambre_air_temperature
            name: Température
            card_mod:
              style: *temp_chambre
          - type: tile
            entity: sensor.bedroom_sensor_chambre_illuminance
            name: Luminosité
            icon: mdi:brightness-6
            card_mod:
              style: *glass_yellow

      - type: grid
        cards:
          - type: heading
            heading: Salle de bain
            heading_style: title
            icon: mdi:shower
          - type: tile
            entity: sensor.temperature_sdb_corrigee
            name: Température
            card_mod:
              style: *temp_sdb
          - type: tile
            entity: sensor.salle_de_bain_tasmota_salle_de_bain_am2301_12_humidity
            name: Humidité
            card_mod:
              style: &glass_blue >-
                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid
                #42a5f5;border-radius:22px;--tile-color:#42a5f5}
          - type: tile
            entity: switch.tasmota_3
            name: Chauffage
            icon: mdi:radiator
            features:
              - type: toggle
            card_mod:
              style: *glow_chauffage

      - type: grid
        cards:
          - type: heading
            heading: Extérieur
            heading_style: title
            icon: mdi:weather-partly-cloudy
          - type: tile
            entity: sensor.salle_de_bain_tasmota_salle_de_bain_am2301_13_temperature
            name: Température
            card_mod:
              style: *temp_ext
          - type: tile
            entity: sensor.salle_de_bain_tasmota_salle_de_bain_am2301_13_humidity
            name: Humidité
            card_mod:
              style: *glass_blue
          - type: tile
            entity: sensor.salle_de_bain_tasmota_salle_de_bain_am2301_13_dewpoint
            name: Point de rosée
            icon: mdi:water-thermometer
            card_mod:
              style: *glass_blue
          - type: tile
            entity: sensor.salle_de_bain_tasmota_salle_de_bain_bmp180_pressure
            name: Pression
            card_mod:
              style: &glass_purple >-
                ha-card{background:rgba(13,23,42,.72);backdrop-filter:blur(14px);border:1px
                solid rgba(148,163,184,.16);border-left:5px solid
                #9575cd;border-radius:22px;--tile-color:#9575cd}

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Prévisions
            heading_style: title
            icon: mdi:weather-cloudy-clock
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
            grid_options:
              columns: 12
            card_mod:
              style: *glass

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Historique
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: Températures (48 h)
            hours_to_show: 48
            show_names: true
            grid_options:
              columns: 12
              rows: 4
            entities:
              - entity: sensor.living_room_temperature_salon_air_temperature
                name: Salon
              - entity: sensor.bedroom_sensor_chambre_air_temperature
                name: Chambre
              - entity: sensor.temperature_sdb_corrigee
                name: SDB
              - entity: sensor.salle_de_bain_tasmota_salle_de_bain_am2301_13_temperature
                name: Extérieur
            card_mod:
              style: *glass
          - type: history-graph
            title: Humidité (48 h)
            hours_to_show: 48
            show_names: true
